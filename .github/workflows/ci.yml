name: CI

on:
  push:
  pull_request:

jobs:
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # actions/checkout v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # actions/setup-python v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Security tests
        run: |
          python -m pytest -q \
            tests/test_cli_allowed_paths.py \
            tests/test_fs_path_traversal.py \
            tests/test_path_traversal.py \
            tests/test_sandbox_filesystem.py \
            tests/test_sandbox_limits.py \
            tests/test_subprocess_sandbox.py

  # #811: the Gate 10b probes ran only at a release, so a probe could go stale
  # and nobody learned until the next cut. That happened at 5.12.0 --
  # `probe_graph_does_not_execute` passed `--allow-paths` to `nodus graph`, which
  # has never declared it, and #791 turned that from harmless into an error. The
  # identical line was fixed in a *test* when #791 landed, because CI runs tests
  # and not probes.
  #
  # The issue's cost objection was that the probes need a built wheel, a clean
  # venv, and a CWD outside the repo. That is true, and it is also about ninety
  # seconds -- CI already builds a wheel and a venv for the distribution smoke
  # test. A separate job keeps it off the 12-minute `test` job's critical path.
  #
  # This does not replace Gate 10b, which still runs at a release against the
  # artifact that will actually be uploaded. It removes the staleness window.
  probes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # actions/checkout v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # actions/setup-python v5.6.0
        with:
          python-version: "3.11"

      - name: Build wheel
        run: |
          python -m pip install --quiet build wheel
          python -m build --wheel

      - name: Release-claims probes against the wheel
        run: |
          python -m venv /tmp/probe-venv
          # With the [http] extra: the #855 probe asserts the trust store is
          # built once per process, and refuses rather than passing vacuously
          # when httpx is absent. Gate 10b's validation venv carries it too.
          WHEEL=$(ls dist/*.whl)
          /tmp/probe-venv/bin/python -m pip install --quiet "${WHEEL}[http]"
          # From outside the repo, and `--require-installed` to prove it: the
          # repo-root `nodus.py` shim inserts `src/` on `sys.path`, so ANY
          # process whose CWD is the checkout resolves `nodus` to the source tree
          # no matter what is installed. That trap shipped 5.0.3 past 32 green
          # probes and recurred at 5.5.0 and 5.6.0.
          cd /tmp
          /tmp/probe-venv/bin/python \
            "$GITHUB_WORKSPACE/tests/eval/release_claims_probe.py" \
            --repo "$GITHUB_WORKSPACE" --require-installed

  # #893: requires-python allows 3.10, but tomllib is stdlib only from 3.11 and
  # the full `test` job runs 3.11 only, so the declared floor was never exercised
  # and a bare `import tomllib` broke every 3.10 install. This installs the built
  # wheel (so the conditional `tomli` dependency is resolved the way a user gets
  # it) into a clean 3.10 venv and imports the modules that do the TOML load,
  # plus a real `--version` and a one-line `run`. Deliberately not the whole
  # suite: lint and mypy are version-sensitive and this guards the import floor.
  py310-floor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # actions/checkout v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # actions/setup-python v5.6.0
        with:
          python-version: "3.10"

      - name: Install the built wheel into a clean 3.10 venv
        run: |
          python -m pip install --quiet build
          python -m build --wheel
          python -m venv /tmp/floor
          /tmp/floor/bin/python -m pip install --quiet "$(ls dist/*.whl)"

      - name: Import the TOML loaders and run on 3.10
        run: |
          cd /tmp
          /tmp/floor/bin/python -c "import nodus.tooling.project, nodus.tooling.user_config, nodus"
          /tmp/floor/bin/nodus --version
          printf 'fn main() { print(6i * 7i) }\n' > floor.nd
          /tmp/floor/bin/nodus run floor.nd

  # #173: PyPy runs Nodus 10-12x faster on long workloads, and every other job
  # here is CPython, so nothing could see PyPy break. That is not hypothetical:
  # #488 pushed `VM` past PyPy's 80-instance-attribute cliff and cost ~9x for
  # three releases with every gate green (#702). And PyPy's GC does not close
  # what CPython's refcounting closes on the spot, so it finds handles held past
  # their scope that CPython hides (#516, #701). This job is the detector for
  # both. It runs pytest only; lint, mypy and the doc gate are interpreter-
  # independent and stay in `test`. mypy is left out of the install because its
  # `ast-serialize` dependency has no PyPy wheel.
  pypy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # actions/checkout v4.3.1

      - name: Set up PyPy
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # actions/setup-python v5.6.0
        with:
          python-version: "pypy3.11"

      - name: Install dependencies (without mypy)
        run: |
          grep -v '^mypy' requirements.txt > /tmp/requirements-pypy.txt
          python -m pip install -r /tmp/requirements-pypy.txt
          python -c "import platform, sys; print(platform.python_implementation(), sys.version)"

      - name: Pytest under PyPy
        run: python -m pytest -q

      - name: Time the self-hosted frontend under PyPy
        # #173: the measurement behind recommending PyPy for long runs. The
        # same step runs in `test` on CPython; compare the two logs. It also
        # re-checks that the self-hosted frontend agrees with the Python one on
        # every tracked .nd file, under this interpreter. Not a gate on speed:
        # runner timings vary, so the numbers are read, not asserted.
        run: python -m tools.selfhost_check

  # #173: compile-to-Python is opt-in, and a compiled function must be
  # indistinguishable from the interpreter except in speed
  # (docs/design/throughput/01-compile-to-python.md). This job runs the whole
  # suite with every eligible function compiled on its first call, so 4,500
  # tests written against the interpreter also run against compiled code.
  # The self-host check then compares tokens, trees and instruction counts.
  compiled:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      NODUS_COMPILE_FUNCTIONS: always
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # actions/checkout v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # actions/setup-python v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pytest with every eligible function compiled
        run: python -m pytest -q

      - name: Time the self-hosted frontend compiled
        # Compare with the same step in `test` (interpreted) and `pypy`.
        run: python -m tools.selfhost_check

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # actions/checkout v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # actions/setup-python v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # #536: the shell-completion tests execute the generated scripts, and each
      # class is guarded on its shell being present — so without these the zsh
      # and fish classes skip silently and the suite reports green on coverage it
      # never ran. That silence is the thing #536 was filed about.
      - name: Install completion shells
        run: sudo apt-get update && sudo apt-get install -y zsh fish

      - name: Lint
        run: |
          # Pinned deliberately. Unpinned, CI installs whatever ruff released
          # most recently: 0.16.1 changed the default rule selection and flagged
          # 684 errors across untouched files (tools/, examples/) on code that
          # was clean the day before. A linter that can change its mind between
          # runs is not a gate. Bump this pin in its own PR, with the resulting
          # fixes, so lint churn never rides along on an unrelated change.
          pip install ruff==0.15.14
          ruff check .

      - name: Type check (mypy)
        run: mypy src/nodus/ --ignore-missing-imports --no-error-summary

      - name: Check .nd formatting
        run: |
          # One module answers both 'which files' and 'is each formatted',
          # and the pre-commit hook calls the same one -- three different
          # answers to the first question is what issue 741 was about. It
          # also runs in a single process: `xargs -I {}` paid an interpreter
          # startup per file, 5m41s for 61 files against about 4s here.
          python -m tools.check_nd_format

      - name: Static checks
        run: |
          python nodus.py check examples/import_demo.nd
          python nodus.py check examples/stdlib_demo.nd

      - name: Doc-vs-code gate
        run: PYTHONPATH="$PWD/src:$PWD" python -m tools.nodus_gate.cli --all

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Pytest
        run: python -m pytest -q

      - name: Time the self-hosted frontend on CPython
        # #173: the measurement behind recommending PyPy for long runs. The
        # same step runs in `pypy` under PyPy; compare the two logs. It also
        # re-checks that the self-hosted frontend agrees with the Python one on
        # every tracked .nd file, under this interpreter. Not a gate on speed:
        # runner timings vary, so the numbers are read, not asserted.
        run: python -m tools.selfhost_check

      - name: Coverage
        run: |
          python -m pytest -q \
            --cov=src/nodus \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            --deselect="tests/test_task_graph.py::TaskGraphTests::test_worker_death_detection"

      - name: Install build tooling
        run: python -m pip install build wheel

      - name: Build wheel
        run: python -m build --wheel

      - name: Installed wheel smoke test
        env:
          NODUS_RUN_DIST_SMOKE: "1"
        run: python -m unittest tests.test_distribution_smoke -v

      - name: Example suite
        run: python nodus.py test-examples
