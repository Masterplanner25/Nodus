name: CI

on:
  push:
  pull_request:

jobs:
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # actions/checkout v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # actions/setup-python v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Security tests
        run: |
          python -m pytest -q \
            tests/test_cli_allowed_paths.py \
            tests/test_fs_path_traversal.py \
            tests/test_path_traversal.py \
            tests/test_sandbox_filesystem.py \
            tests/test_sandbox_limits.py \
            tests/test_subprocess_sandbox.py

  # #811: the Gate 10b probes ran only at a release, so a probe could go stale
  # and nobody learned until the next cut. That happened at 5.12.0 --
  # `probe_graph_does_not_execute` passed `--allow-paths` to `nodus graph`, which
  # has never declared it, and #791 turned that from harmless into an error. The
  # identical line was fixed in a *test* when #791 landed, because CI runs tests
  # and not probes.
  #
  # The issue's cost objection was that the probes need a built wheel, a clean
  # venv, and a CWD outside the repo. That is true, and it is also about ninety
  # seconds -- CI already builds a wheel and a venv for the distribution smoke
  # test. A separate job keeps it off the 12-minute `test` job's critical path.
  #
  # This does not replace Gate 10b, which still runs at a release against the
  # artifact that will actually be uploaded. It removes the staleness window.
  probes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # actions/checkout v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # actions/setup-python v5.6.0
        with:
          python-version: "3.11"

      - name: Build wheel
        run: |
          python -m pip install --quiet build wheel
          python -m build --wheel

      - name: Release-claims probes against the wheel
        run: |
          python -m venv /tmp/probe-venv
          /tmp/probe-venv/bin/python -m pip install --quiet dist/*.whl
          # From outside the repo, and `--require-installed` to prove it: the
          # repo-root `nodus.py` shim inserts `src/` on `sys.path`, so ANY
          # process whose CWD is the checkout resolves `nodus` to the source tree
          # no matter what is installed. That trap shipped 5.0.3 past 32 green
          # probes and recurred at 5.5.0 and 5.6.0.
          cd /tmp
          /tmp/probe-venv/bin/python \
            "$GITHUB_WORKSPACE/tests/eval/release_claims_probe.py" \
            --repo "$GITHUB_WORKSPACE" --require-installed

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # actions/checkout v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # actions/setup-python v5.6.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # #536: the shell-completion tests execute the generated scripts, and each
      # class is guarded on its shell being present — so without these the zsh
      # and fish classes skip silently and the suite reports green on coverage it
      # never ran. That silence is the thing #536 was filed about.
      - name: Install completion shells
        run: sudo apt-get update && sudo apt-get install -y zsh fish

      - name: Lint
        run: |
          # Pinned deliberately. Unpinned, CI installs whatever ruff released
          # most recently: 0.16.1 changed the default rule selection and flagged
          # 684 errors across untouched files (tools/, examples/) on code that
          # was clean the day before. A linter that can change its mind between
          # runs is not a gate. Bump this pin in its own PR, with the resulting
          # fixes, so lint churn never rides along on an unrelated change.
          pip install ruff==0.15.14
          ruff check .

      - name: Type check (mypy)
        run: mypy src/nodus/ --ignore-missing-imports --no-error-summary

      - name: Check .nd formatting
        run: |
          # One module answers both 'which files' and 'is each formatted',
          # and the pre-commit hook calls the same one -- three different
          # answers to the first question is what issue 741 was about. It
          # also runs in a single process: `xargs -I {}` paid an interpreter
          # startup per file, 5m41s for 61 files against about 4s here.
          python -m tools.check_nd_format

      - name: Static checks
        run: |
          python nodus.py check examples/import_demo.nd
          python nodus.py check examples/stdlib_demo.nd

      - name: Doc-vs-code gate
        run: PYTHONPATH="$PWD/src:$PWD" python -m tools.nodus_gate.cli --all

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Pytest
        run: python -m pytest -q

      - name: Coverage
        run: |
          python -m pytest -q \
            --cov=src/nodus \
            --cov-report=term-missing \
            --cov-fail-under=70 \
            --deselect="tests/test_task_graph.py::TaskGraphTests::test_worker_death_detection"

      - name: Install build tooling
        run: python -m pip install build wheel

      - name: Build wheel
        run: python -m build --wheel

      - name: Installed wheel smoke test
        env:
          NODUS_RUN_DIST_SMOKE: "1"
        run: python -m unittest tests.test_distribution_smoke -v

      - name: Example suite
        run: python nodus.py test-examples
